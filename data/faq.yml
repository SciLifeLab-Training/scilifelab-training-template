faq:

# OPTIONAL 

  # This file contains frequently asked questions and their answers. They
  # are shown on the FAQ page, numbered in the order they appear here.

  # ==================================================
  # Leaving information out
  # ==================================================
  #
  # Each question needs both a question and an answer. A question without
  # an answer is not shown, and the questions are numbered automatically.
  #
  # - To remove one question, delete it from its "- question:" line down to
  #   the end of its answer.
  # - To hide the whole FAQ page (also from the navbar), empty or delete
  #   this file. A file with only the intro is also left out.


  # --------------------------------------------------
  # Page introduction
  # --------------------------------------------------

  intro: >
    Use this page to provide answers to common questions about the
    training. Include information that participants may need before
    or during the training.

  # --------------------------------------------------
  # Questions
  # --------------------------------------------------
  # Add one entry for each frequently asked question + answer.
  #
  # Keep questions specific and practical. Good FAQ topics may
  # include registration, preparation, attendance, the schedule,
  # technical requirements, certificates, or other common questions.


  questions:

    - question: "Example question 1"
      answer: >
        Provide the answer to the question here.

    - question: "Example question 2"
      answer: >
        Provide the answer to the question here.

    - question: "Example question 3"
      answer: >
        Provide the answer to the question here.