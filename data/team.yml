team:

  # This file contains information about the training team
  # used throughout the website, including the Team page,
  # syllabus, and overview page team preview.
  #
  # Some fields are required and some are optional.
  #
  # The validator (validators.py) checks the required fields
  # and stops the website from rendering if any required
  # information is missing.

  # ==================================================
  # Team data rules
  # ==================================================

  # At least one team member is required.
  
  # Required fields for every team member:
    # - given_names (first name or names)
    # - family_names (surname, including e.g. "van der")
    # - roles
    # - affiliation
  
  # Allowed roles:
    # - Training lead
    # - Instructor
    # - Contributor
  
  # At least one team member must have:
    # - course_contact: true
    # - an email address
  
  # Training leads are optional.

  # On the overview page, up to two team members are shown:
    # 1. Training leads first.
    # 2. Instructors fill any remaining places.
    # 3. Contributors are not shown in the homepage preview.

  # Optional fields for team members:
    # - job_title
    # - email
    # - course_contact
    # - bio
    # - orcid
    # - linkedin
    # - github
    # - website
    # - image
    # - citation_author: set to false to leave this person out of the
    #   citation and the Zenodo record. They are still shown on the
    #   website. Everyone else is included as an author.


  # --------------------------------------------------
  # Page introduction
  # --------------------------------------------------

  intro: >
    Use this section to introduce the training team. Briefly
    describe who develops and delivers the training and the
    roles represented on the team.

  # --------------------------------------------------
  # Team members
  # --------------------------------------------------

  members:
  
    # --------------------------------------------------
    # Training leads
    # --------------------------------------------------
    #
    # Training leads are responsible for the overall
    # development, coordination, and delivery of the training.
    #
    # The "roles" value must contain "Training lead" for the
    # person to appear in the training-lead section.
    #
    # Training leads are shown first in the homepage team
    # preview, followed by instructors if fewer than two
    # training leads are available.

    - given_names: "Firstname1"
      family_names: "Lastname1"
      roles:
        - Training lead
      job_title: "Job Title"
      affiliation: "Institution or organisation"
      email: "training.lead@example.org"
      # Set course_contact to true if participants should be able to identify this person as a course contact.
      course_contact: true
      bio: >
        Provide a 1-to-2-sentence biography describing this person's
        expertise, role in the training, and relevant experience.
      # Optional profile links. Leave empty if not applicable.
      orcid: "https://orcid.org/0000-0000-0000-0000"
      linkedin: "https://www.linkedin.com/in/example"
      github: ""
      website: ""
      image: "img/photos/team-photo.jpeg"
      citation_author: true

    # Add another training lead if applicable.
    - given_names: "Firstname2"
      family_names: "Lastname2"
      roles:
        - Training lead
      job_title: "Job Title"
      affiliation: "Institution or organisation"
      email: ""
      course_contact: false
      bio: >
        Provide a 1-to-2-sentence biography describing this person's
        expertise, role in the training, and relevant experience.
      orcid: ""
      linkedin: ""
      github: "https://github.com/example"
      website: "https://example.org"
      image: "img/photos/team-photo.jpeg"
      citation_author: true


    # --------------------------------------------------
    # Instructors
    # --------------------------------------------------
    #
    # Instructors teach, facilitate, or otherwise contribute
    # directly to the educational activities.
    #
    # Use the role "Instructor" to place a person in the
    # instructor section of the full Team page.

    - given_names: "Firstname3"
      family_names: "Lastname3"
      roles:
        - Instructor
      job_title: "Job Title"
      affiliation: "Institution or organisation"
      email: "instructor@example.org"
      course_contact: false
      bio: >
        Provide a 1-to-2-sentence biography describing this person's
        expertise, role in the training, and relevant experience.
      orcid: ""
      linkedin: "https://www.linkedin.com/in/example"
      github: ""
      website: ""
      image: "img/photos/team-photo.jpeg"
      citation_author: true

    # Add another instructor if applicable.


    # --------------------------------------------------
    # Contributors
    # --------------------------------------------------
    #
    # Contributors provide expertise, content, materials,
    # technical support, or other contributions to the training.
    #
    # Use the role "Contributor" to place a person in the
    # contributor section of the full Team page.

    - given_names: "Firstname4"
      family_names: "Lastname4"
      roles:
        - Contributor
      job_title: "Job Title"
      affiliation: "Institution or organisation"
      email: ""
      course_contact: false
      bio: >
        Provide a 1-to-2-sentence biography describing this person's
        expertise, role in the training, and relevant experience.
      orcid: "https://orcid.org/0000-0000-0000-0000"
      linkedin: ""
      github: "https://github.com/example"
      website: ""
      image: "img/photos/team-photo.jpeg"
      citation_author: false

    # Add another contributor if applicable.
    
    - given_names: "Firstname5"
      family_names: "Lastname5"
      roles:
        - Contributor
      job_title: ""
      affiliation: "Institution or organisation"
      email: "contributor@example.org"
      course_contact: false
      bio: ""
      orcid: ""
      linkedin: ""
      github: ""
      website: "https://example.org"
      image: ""
      citation_author: false