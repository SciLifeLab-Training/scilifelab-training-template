website:
# This file contains the information displayed on the
# overview page of a training website.
#
# The comments below describe which sections are included,
# when they are displayed, and where their content is configured.

  # ==================================================
  # Template banner
  # ==================================================
  #
  # Not always displayed.
  # To remove the banner when adopting the template for your own training,
  # either delete the file _sections/template-banner.qmd,
  # or remove {{< include _sections/template-banner.qmd >}} from index.qmd 

  # ==================================================
  # Navbar
  # ==================================================
  #
  # Always displayed.
  # The training title is read from course.yml.

  # Logos
  # -----
  # Add one or more logos to the list below by adding a new 
  # list item. Do not add empty placeholders for logos that are not used.
  #
  # SciLifeLab is always displayed on the right. Other logos are displayed to 
  # its left, in the order in which they appear in this list.
  #
  # For best results, use logos that:
  #   - Are white or designed for use on a dark background.
  #   - Have a transparent background, where appropriate.
  #   - Have minimal empty space around the visible artwork.
  #   - Preserve their original aspect ratio when resized.
  #
  # SVG files are preferred because they remain sharp at any size.
  # For raster images (such as PNG), use a sufficiently high-resolution
  # image. For a displayed height of 46 px, a source height of at least
  # 92 px is recommended for sharp rendering on high-density screens.
  #
  # Adjust the height of each logo independently to make their visible
  # artwork appear approximately the same height.
 
  navbar:
    logos:
      - src: "img/scilifelab-logo-full-neg.png"
        alt: "SciLifeLab"
        height: 46
        primary: true

      # - src: "img/nbis-neg.png"
      #   alt: "Partner organisation"
      #   height: 26


  # Navigation links are generated from the available pages.
  #
  # Overview and Content are always included.
  # Schedule is included only when schedule.yml contains events.
  #
  # The Information dropdown is displayed when at least one of
  # its links is available. Team and Syllabus are always included.
  # Preparation, Practicalities, Announcements, Resources and FAQ 
  # are included if their corresponding data files (e.g. preparation.yml)
  # contain data. 
  #
  # IMPORTANT: deleting the corresponding quarto file (e.g. 
  # preparation.qmd) does therefore not by itself remove preparation 
  # from the navbar.
  #
  # The current page is highlighted automatically.


  # ==================================================
  # Welcome section
  # ==================================================
  #
  # Always displayed. The training title is required.
  # Dates and location are displayed only
  # when provided in course.yml. 
  #
  # The welcome title and text are optional. 
  # Keep the welcome text concise: briefly explain what the training is
  # about and what participants will find on the website.
  #
  # The image is optional. Store the image file in the img/
  # directory, and configure its path and alternative text here.

  welcome:

    title: "Welcome to the training"

    text: >
      Use this section to introduce the training. Briefly describe
      what participants will learn, what they can expect, and what
      they will find on this website.

    image:
      # Replace with the path to the welcome image.
      src: "img/welcome-graphic-placeholder.svg"

      # Describe the image for accessibility.
      alt: "Welcome illustration"


  # ==================================================
  # Registration banner
  # ==================================================
  #
  # Not always displayed. 
  # The registration banner is included on the homepage,
  # but is displayed only when registration is enabled
  # and an opening date is provided.
  #
  # It is configured to behave in the following manner:
  # - Before registration opens, it displays the opening date.
  # - While registration is open, it displays the deadline,
  #   fee information (if provided), and registration link.
  # - After registration closes, it either displays a closed
  #   message or is fully hidden, depending on the value in "after_closing".
  #
  # If no closing date is provided, registration remains open
  # indefinitely after the opening date.
  #
  # While registration is open, a URL is required for the
  # banner to be displayed.
  #
  # Dates should use the format YYYY-MM-DD.

  registration:

    # Set "enabled" to true to show the registration banner.
    # Set it to false if the training does not have registration
    # information or if you do not want to show it.
    enabled: true

    opening_date: "2026-01-01"
    closing_date: "2026-12-31"
    # Choose what happens after registration closes:
    # - closed: display a "Registration is now closed" message.
    # - hide: hide the registration information.
    after_closing: "closed"
    # add the link to the registration page or form.
    url: "https://registration.example.com"
    cost:
        # The training fee is optional.
        # The fee is displayed only when both amount and currency
        # are provided. The note is optional and can explain
        # different fees or direct participants to further details.
      amount: amount
      currency: "SEK"
      note: >
        Provide information on whether the training cost differs depending on the participant's institution.


  # ==================================================
  # 'Next up' section 
  # ==================================================
  #
  # Not always displayed. 
  # Generated from data/schedule.yml.
  # Displayed only when the schedule contains events.
  # If there are no events, the section is omitted.

  # ==================================================
  # Quick links section
  # ==================================================
  #
  # Always displayed. 
  # Defines the title, description, icon, and source page
  # for pages that can be displayed as homepage quick links
  # and used in the website navigation.
  #
  # Content and Syllabus are always included as quick links. 
  # Other optional pages are included only when twhen they also appear in the navbar,
  # i.e. when their data file contains data after its YAML front matter (i.e. after 
  # ---
  # title: Practicalities
  # title-block: false
  # ---).
  #
  # You can leave an optional page's .qmd file empty,
  # to prevent it from appearing as a quick link. 

  # IMPORTANT: you must keep all optional page entries below (i.e. do not delete them),
  # since the renderer expects the configured page keys!
  #
  # Quick links are considered in this order:
  # Content, Syllabus, Schedule, Practicalities, Preparation,
  # Resources, FAQ.
  # A maximum of four quick links is displayed.

  pages:

    # Links to training content page.
    content:
      title: "Content"
      description: "Modules, slides and exercises"
      icon: "folder"
      href: "content/index.qmd"

    # Links to syllabus page.
    syllabus:
      title: "Syllabus"
      description: "Description, learning outcomes and prerequisites"
      icon: "journal-text"
      href: "syllabus.qmd"

    # Links to schedule page.
    schedule:
      title: "Schedule"
      description: "Programme, sessions and timings"
      icon: "calendar2-event"
      href: "schedule.qmd"

    # Links to practicalities
    practicalities:
      title: "Practicalities"
      description: "Venue, travel, accommodation and other practical information"
      icon: "geo-alt"
      href: "practicalities.qmd"

    # Links to preparation page.
    preparation:
      title: "Preparation"
      description: "What to do and prepare before the training"
      icon: "clipboard-check"
      href: "preparation.qmd"

    # Links to resources page.
    resources:
      title: "Resources"
      description: "Further reading, links and useful resources"
      icon: "bookshelf"
      href: "resources.qmd"

    # Links to FAQ page
    faq:
      title: "FAQ"
      description: "Answers to frequently asked questions"
      icon: "question-circle"
      href: "faq.qmd"


  # ==================================================
  # Announcements section
  # ==================================================
  #
  # Always displayed.
  # Announcements are configured in data/announcements.yml.
  # If there are no announcement items, the section displays
  # "No active announcements."
  #
  # IMPORTANT: Keep data/announcements.yml in place, even when it is empty. 

  # ==================================================
  # Team section
  # ==================================================
  #
  # Always displayed. 
  # Team information is configured in data/team.yml.
  #
  # The homepage preview displays up to two team members:
  # 1. Training leads are shown first.
  # 2. Instructors fill any remaining places.
  # 3. Contributors are not shown in the homepage preview.

  # ==================================================
  # Footer
  # ==================================================
  #
  # Always displayed
  # Controls the content displayed in the website footer.
  #
  # Organisation and licence information are displayed when
  # provided. Template attribution is displayed when configured.
  # The repository link and icon are displayed only when both
  # a repository URL and image are provided.
  
  footer:

    # Name of the organisation, programme, or group
    # responsible for the training.
    organisation: "Organisation or Training Programme name"

    # Licence applied to the training website/content.
    licence:
      name: "CC BY 4.0"
      url: "https://creativecommons.org/licenses/by/4.0/"

    # Text describing the website template used to build
    # this website.
    # Usually this can be left unchanged unless the
    # template attribution needs to be modified.
    built_with:
      text: "This website was built using the"
      template_name: "SciLifeLab Training Webpage Template"
      template_url: "https://github.com/SciLifeLab-Training/scilifelab-training-template"
      suffix: "and is hosted on GitHub Pages."

    # Link and image used for the repository icon in the footer.
    # Replace "url" with the GitHub repository for this specific
    # course website. The url is required: it is also used to work
    # out the website address for the citation and Bioschemas files.
    repository:
      url: "https://github.com/your-organisation/your-repository"

      # Image displayed as the repository link.
      # Normally this can be left unchanged.
      image: "img/github-neg.png"

      # Alternative text for the repository image.
      alt: "GitHub repository"



content:
# Use this section to define the structure and order of
# the training content pages navigation.
#
# First, decide how to organise your training content.
# Divide it into modules or other major sections, and
# create one folder for each section inside the content/
# directory.
#
# Then add one entry below for each folder, in the order
# you want the sections to appear in the navigation.
#
# For each section:
#
# - "id" must match the folder name inside content/.
# - "label" is the short name displayed in the navigation.
# - "title" is used as the navigation button's tooltip text.
#
# For example, an id of "module-1" corresponds to the
# folder content/module-1/.
#
# You can add, remove, rename, or reorder sections to
# match your training structure. If you rename a section,
# make sure to update both the folder name and its id here.


  sections:

    - id: module-1
      label: "Module 1"
      title: "How to structure a page"

    - id: module-2
      label: "Module 2"
      title: "How to highlight information"

    - id: module-3
      label: "Module 3"
      title: "Module 3 Title"