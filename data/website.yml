website:

  # This file controls the landing page: logos, labels, the
  # "All training instances" banner and the footer.
  #
  # The training instances themselves are listed in
  # data/instances.yml.

  # ==================================================
  # Template mode
  # ==================================================
  #
  # true: this repository is the SciLifeLab Training Webpage Template
  # itself. The landing page shows the "Want to use this template?"
  # banner, and CITATION.cff, .zenodo.json and the README describe the
  # template (from the files in _template/), not this example training.
  #
  # false: this repository is your own training. Set this to false
  # when you start using the template. The banner disappears, and
  # CITATION.cff and .zenodo.json describe your training, from
  # data/course.yml and data/team.yml.

  template: true

  # ==================================================
  # Hero
  # ==================================================
  #
  # The top of the landing page. The title and subtitle come from
  # data/course.yml.
  #
  # Logos: add one or more logos. The logo with "primary: true"
  # (SciLifeLab) is always shown on the right. The other logos are
  # shown to its left, in the order of this list.
  #
  # For each logo:
  #   src:     where the file is, for example "img/logos/my-logo.svg"
  #   alt:     the name of the organisation, read out by screen readers
  #   height:  optional. The height of the logo in pixels (56 if left
  #            out). Adjust the heights so that the visible artwork of
  #            all logos looks about the same size. On smaller screens,
  #            all logos shrink in proportion.
  #   primary: optional. true for the one logo that is always shown
  #            on the right.
  #
  # For best results, use logos that:
  #   - are white or designed for use on a dark background;
  #   - have a transparent background;
  #   - have little empty space around the visible artwork.
  #
  # SVG files are preferred because they stay sharp at any size. For
  # PNG files, use an image at least twice as high as the height you
  # set here, so it stays sharp on high-resolution screens.

  hero:
    logos:
      - src: "img/logos/scilifelab-neg.png"
        alt: "SciLifeLab"
        height: 56
        primary: true

      # - src: "img/logos/partner-logo.svg"
      #   alt: "Partner organisation"
      #   height: 40

  # ==================================================
  # Labels
  # ==================================================
  #
  # Text on the buttons and headings that are created automatically.

  labels:
    # Button that links to the current training instance.
    hero_view_current_label: "Take me to the current instance"
    # Button that links to the registration of the current instance.
    # Only shown when the current instance has a registration_url in
    # data/instances.yml.
    hero_registration_open_label: "Register now"
    # Heading of the banner that lists all training instances.
    instances_band_title: "All training instances"

  # ==================================================
  # "All training instances" banner
  # ==================================================
  #
  # The decorative image on the left of the banner.

  instances_band:
    image: "img/images/navet-band.png"

  # ==================================================
  # Footer
  # ==================================================
  #
  # Most of the footer is filled in automatically, so you don't have
  # to write anything twice:
  #   - the organisation: "organizers" in data/course.yml;
  #   - the licence: "reuse.licence" and "reuse.licence_url" in
  #     data/course.yml;
  #   - the link to your GitHub repository: worked out automatically.
  #
  # Only the text below is set here. You can usually leave it as it is.

  footer:

    # Text describing how the website was built.
    built_with:
      text: "This website was built using the"
      template_name: "SciLifeLab Training Webpage Template"
      template_url: "https://github.com/SciLifeLab-Training/scilifelab-training-template"
      suffix: "and is hosted on GitHub Pages."

    # The icon that links to your GitHub repository.
    repository:
      image: "img/logos/github-neg.png"
      alt: "GitHub repository"

      # The address of your repository is worked out automatically.
      # Only add it here if that doesn't work, for example:
      # url: "https://github.com/organisation/repository"
